name: ChatGPTStackDemo
options:
  bundleIdPrefix: com.davidpovarsky
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui.git
    from: 2.4.0
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher.git
    from: 8.0.0
  Highlightr:
    url: https://github.com/raspu/Highlightr.git
    from: 2.1.2
  Lottie:
    url: https://github.com/airbnb/lottie-ios.git
    from: 4.5.0
  Pow:
    url: https://github.com/EmergeTools/Pow.git
    from: 1.0.0
targets:
  ChatGPTStackDemo:
    type: application
    platform: iOS
    sources:
      - path: ChatGPTStackDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davidpovarsky.ChatGPTStackDemo
        PRODUCT_NAME: ChatGPTStackDemo
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Agent UI Lab
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Camera access is used by the attachment UI demo.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Microphone access is used by the voice UI demo.
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - package: MarkdownUI
        product: MarkdownUI
      - package: Kingfisher
        product: Kingfisher
      - package: Highlightr
        product: Highlightr
      - package: Lottie
        product: Lottie
      - package: Pow
        product: Pow
schemes:
  ChatGPTStackDemo:
    build:
      targets:
        ChatGPTStackDemo: all
    run:
      config: Debug
    archive:
      config: Release
